[project]
name = "churn-prediction-ml"
version = "0.1.0"
description = "End-to-end customer churn prediction: data, features, models, API and UI."
requires-python = ">=3.10"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
